  .risk h4{margin:0;font-size:16px;font-weight:660;flex:1;min-width:150px}
  .risk p{margin:0 0 10px;font-size:14px;color:var(--ink-2);line-height:1.55}
  .risk .meta{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0;font-size:12.5px}
  .risk .meta span{color:var(--mute)} .risk .meta b{color:var(--ink-2);font-weight:640}
  .risk .mit{background:var(--canvas);border-radius:8px;padding:11px 13px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
  .risk .mit b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);display:block;margin-bottom:3px}

  /* Actions */
  .action{display:grid;grid-template-columns:44px 1fr;background:var(--card);border:1px solid var(--line);
    border-radius:12px;margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow)}
  .action .n{background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:700}
  .action .body{padding:16px 18px}
  .action h4{margin:0 0 6px;font-size:16px;font-weight:650;line-height:1.4}
  .action p{margin:0 0 11px;font-size:14px;color:var(--slate);line-height:1.55}
  .action .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:12px;background:var(--line-2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;color:var(--slate)}
  .tag b{color:var(--ink-2);font-weight:640}
  .action .to{margin-top:11px;font-size:13px;color:var(--slate);border-left:2px solid var(--line);padding-left:11px}

  /* Next steps */
  .steps{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .step{display:grid;grid-template-columns:128px 1fr 150px;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line-2);
    font-size:14px;align-items:baseline}
  .step:last-child{border-bottom:0}
  .step .w{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--brand-2)}
  .step .o{text-align:right;color:var(--slate);font-size:13px}

  /* Notes */
  .notes{background:#FBFCFE;border:1px dashed var(--line);border-radius:12px;padding:16px 20px}
  .notes h3{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700}
  .notes ul{margin:0;padding-left:19px} .notes li{font-size:13.5px;color:var(--slate);margin-bottom:5px;line-height:1.55}

  /* Charts */
  .chart{width:100%;display:block;overflow:visible}
  .chart text{font-family:inherit;font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--slate)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  @media (max-width:720px){
    .wrap{padding:0 16px 48px}
    .mast-title{font-size:23px}
    .alert{grid-template-columns:1fr} .alert .sev{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line-2)}
    .step{grid-template-columns:1fr;gap:4px} .step .o{text-align:left}
    .action{grid-template-columns:1fr} .action .n{padding:6px;font-size:14px}
  }
  @media print{
    body{background:#fff} .masthead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .card,.kpi,.alert,.risk,.action,.steps,.arstrip,.tbl-wrap{box-shadow:none}
    section{break-inside:avoid} .alert,.risk,.action{break-inside:avoid}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const D = (typeof DATA !== 'undefined' && DATA) ? DATA : (window.DATA || {});
  const el = document.getElementById('app');
  const has = v => v !== undefined && v !== null && (Array.isArray(v) ? v.length > 0 : String(v).trim() !== '');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sev = s => ['critical','high','medium','low','ok'].includes(String(s||'').toLowerCase())
    ? String(s).toLowerCase() : 'plain';
  const pill = s => `<span class="pill ${sev(s)}">${esc(s||'')}</span>`;
  const fmt = n => {
    if (typeof n !== 'number') return esc(n);
    const a = Math.abs(n);
    if (a >= 1e9) return (n/1e9).toFixed(2).replace(/\.00$/,'') + 'B';
    if (a >= 1e6) return (n/1e6).toFixed(2).replace(/\.00$/,'') + 'M';
    if (a >= 1e3) return Math.round(n/1e3) + 'k';
    return String(Math.round(n));
  };
  const SEVC = {critical:'#B3261E',high:'#B45309',medium:'#C09A2E',low:'#6E9B33',ok:'#0F6B4F',plain:'#8A99AD'};
  let out = '';

  /* ---------- Masthead ---------- */
  const m = D.meta || {};
  out += `<header class="masthead"><div class="wrap">
    <div class="mast-eyebrow">CFO Review</div>
    <h1 class="mast-title">${esc(m.company||'CFO Review')}</h1>
    ${has(m.subtitle)?`<p class="mast-sub">${esc(m.subtitle)}</p>`:''}
    <div class="mast-meta">
      ${has(m.period)?`<div>Period<strong>${esc(m.period)}</strong></div>`:''}
      ${has(m.asOf)?`<div>As at<strong>${esc(m.asOf)}</strong></div>`:''}
      ${has(m.currency)?`<div>Currency<strong>${esc(m.currency)}</strong></div>`:''}
      ${has(m.preparedFor)?`<div>Prepared for<strong>${esc(m.preparedFor)}</strong></div>`:''}
      ${has(m.preparedBy)?`<div>Prepared by<strong>${esc(m.preparedBy)}</strong></div>`:''}
    </div></div></header><div class="wrap">`;

  const secHead = t => `<div class="sec-head"><h2>${esc(t)}</h2><div class="rule"></div></div>`;

  /* ---------- 1. Executive Summary ---------- */
  const h = D.headline || {};
  if (has(h.verdict) || has(h.summary)) {
    const p = sev(h.posture || 'medium');
    const lbl = {critical:'Immediate action required',high:'Action required',
                 medium:'Attention needed',low:'Monitor',ok:'Position stable',plain:'Review'}[p];
    out += `<section>${secHead('Executive Summary')}
      <div class="verdict ${p}">
        <div class="verdict-label">${lbl}</div>
        ${has(h.verdict)?`<h3>${esc(h.verdict)}</h3>`:''}
        ${has(h.summary)?`<div class="summary">${(h.summary||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:''}
        ${has(h.callouts)?`<div class="callouts">${h.callouts.map(c=>
          `<div class="callout"><div class="k">${esc(c.label)}</div><div class="v">${esc(c.value)}</div></div>`).join('')}</div>`:''}
      </div></section>`;
  }

  /* ---------- 2. Executive KPI Summary ---------- */
  if (has(D.kpis)) {
    out += `<section>${secHead('Executive KPI Summary')}<div class="kpis">` +
      D.kpis.map(k=>{
        const dir = k.trend==='up'?'▲':k.trend==='down'?'▼':'–';
        const cls = k.good===true?'good':k.good===false?'bad':'neutral';
        return `<div class="kpi ${sev(k.severity)}">
          <div class="k">${esc(k.label)}</div>
          <div class="v num">${esc(k.value)}</div>
          ${has(k.delta)?`<div class="d ${cls}">${dir} ${esc(k.delta)}</div>`:''}
          ${has(k.note)?`<div class="n">${esc(k.note)}</div>`:''}</div>`;
      }).join('') + `</div></section>`;
  }

  /* ---------- 3. A/R Overview ---------- */
  const ar = D.ar || {};
  if (has(ar.total) || has(ar.dso) || has(ar.buckets)) {
    out += `<section>${secHead('Accounts Receivable Overview')}`;
    if (has(ar.commentary)) out += `<p class="sec-note">${esc(ar.commentary)}</p>`;
    const cells = [
      ['Total receivables', ar.total, ''],
      ['Current',           ar.current, ''],
      ['Past due',          ar.overdue, ''],
      ['DSO',               ar.dso, has(ar.dsoPrior)?`Prior: ${ar.dsoPrior}`:''],
      ['Target DSO',        ar.dsoTarget, '']
    ].filter(c=>has(c[1]));
    if (cells.length) out += `<div class="arstrip">` + cells.map(c=>
      `<div><div class="k">${esc(c[0])}</div><div class="v num">${esc(c[1])}</div>
       ${has(c[2])?`<div class="s num">${esc(c[2])}</div>`:''}</div>`).join('') + `</div>`;
    out += `</section>`;
  }

  /* ---------- 4. Aging Analysis ---------- */
  if (has(ar.buckets)) {
    const b = ar.buckets, tot = b.reduce((s,x)=>s+(+x.amount||0),0) || 1;
    const W = 1000, BH = 46, GAP = 12, LW = 92, RW = 128;
    const H = b.length*(BH+GAP);
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accounts receivable aging">`;
    b.forEach((x,i)=>{
      const y = i*(BH+GAP), pct = (+x.amount||0)/tot, bw = Math.max(2,(W-LW-RW)*pct);
      const c = SEVC[sev(x.severity)];
      svg += `<text x="0" y="${y+BH/2+5}" font-size="14" font-weight="600" fill="#1F2C40">${esc(x.label)}</text>`;
      svg += `<rect x="${LW}" y="${y+6}" width="${W-LW-RW}" height="${BH-12}" rx="5" fill="#EEF2F7"/>`;
      svg += `<rect x="${LW}" y="${y+6}" width="${bw}" height="${BH-12}" rx="5" fill="${c}"/>`;
      svg += `<text x="${W-RW+14}" y="${y+BH/2+1}" font-size="14.5" font-weight="680" fill="#0E1726">${esc(fmt(+x.amount||x.amount))}</text>`;
      svg += `<text x="${W-RW+14}" y="${y+BH/2+17}" font-size="12" fill="#8A99AD">${(pct*100).toFixed(1)}%${has(x.count)?` · ${esc(x.count)} inv`:''}</text>`;
    });
    svg += `</svg>`;
    out += `<section>${secHead('Aging Analysis')}`;
    if (has(ar.agingCommentary)) out += `<p class="sec-note">${esc(ar.agingCommentary)}</p>`;
    out += `<div class="card pad">${svg}
      <div class="legend">${['ok','low','medium','high','critical'].map(s=>
        `<span><i style="background:${SEVC[s]}"></i>${({ok:'Current',low:'Early',medium:'Watch',high:'At risk',critical:'Impairment risk'})[s]}</span>`).join('')}</div>
      </div></section>`;
  }

  /* ---------- 4b. Concentration ---------- */
  const con = D.concentration || {};
  if (has(con.items)) {
    const it = con.items, mx = Math.max(...it.map(x=>+x.pct||0), con.threshold||0) * 1.15 || 1;
    const W=1000, BH=34, GAP=9, LW=210, RW=70, H=it.length*(BH+GAP);
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Concentration">`;
    if (has(con.threshold)) {
      const tx = LW + (W-LW-RW)*((+con.threshold)/mx);
      svg += `<line x1="${tx}" y1="0" x2="${tx}" y2="${H-GAP}" stroke="#B3261E" stroke-width="1.5" stroke-dasharray="4 4" opacity=".65"/>`;
      svg += `<text x="${tx+6}" y="12" font-size="11" fill="#B3261E" font-weight="650">${esc(con.threshold)}% threshold</text>`;
    }
    it.forEach((x,i)=>{
      const y=i*(BH+GAP), bw=Math.max(2,(W-LW-RW)*((+x.pct||0)/mx));
      const over = (+x.pct||0) >= (con.threshold||Infinity);
      svg += `<text x="0" y="${y+BH/2+5}" font-size="13.5" font-weight="600" fill="#1F2C40">${esc(x.name)}</text>`;
      svg += `<rect x="${LW}" y="${y+5}" width="${bw}" height="${BH-10}" rx="4" fill="${over?SEVC.critical:'#2E5A9E'}"/>`;
      svg += `<text x="${LW+bw+10}" y="${y+BH/2+5}" font-size="13" font-weight="670" fill="#0E1726">${(+x.pct||0).toFixed(1)}%</text>`;
    });
    svg += `</svg>`;
    out += `<section>${secHead('Concentration')}`;
    if (has(con.commentary)) out += `<p class="sec-note">${esc(con.commentary)}</p>`;
    out += `<div class="card pad">${svg}</div></section>`;
  }

  /* ---------- 5. Customer Risk Rankings ---------- */
  if (has(D.customerRisk)) {
    out += `<section>${secHead('Customer Risk Rankings')}<div class="tbl-wrap"><table>
      <thead><tr><th></th><th>Customer</th><th class="r">Exposure</th><th class="r">% Rev</th>
      <th class="r">Days past due</th><th>Risk</th><th>Assessment and action</th></tr></thead><tbody>` +
      D.customerRisk.map(c=>`<tr>
        <td class="rank num">${esc(c.rank??'')}</td>
        <td class="name">${esc(c.name)}</td>
        <td class="r num">${esc(c.exposure??'')}</td>
        <td class="r num">${esc(c.revenuePct??'')}</td>
        <td class="r num">${esc(c.daysPastDue??'')}</td>
        <td>${pill(c.tier)}</td>
        <td>${esc(c.drivers??'')}${has(c.action)?`<span class="sub"><b>Action:</b> ${esc(c.action)}</span>`:''}</td>
      </tr>`).join('') + `</tbody></table></div></section>`;
  }

  /* ---------- 6. Collection Priorities ---------- */
  if (has(D.collections)) {
    out += `<section>${secHead('Collection Priorities')}<div class="tbl-wrap"><table>
      <thead><tr><th></th><th>Customer</th><th class="r">Amount</th><th class="r">Age</th>
      <th>Recovery</th><th>Owner</th><th>By</th><th>Action</th></tr></thead><tbody>` +
      D.collections.map(c=>`<tr>
        <td class="rank num">${esc(c.priority??'')}</td>
        <td class="name">${esc(c.customer)}</td>
        <td class="r num">${esc(c.amount??'')}</td>
        <td class="r num">${esc(c.age??'')}</td>
        <td>${esc(c.likelihood??'')}</td>
        <td>${esc(c.owner??'')}</td>
        <td>${esc(c.dueBy??'')}</td>
        <td>${esc(c.action??'')}</td>
      </tr>`).join('') + `</tbody></table></div></section>`;
  }

  /* ---------- 7. Cash Collection Forecast ---------- */
  const f = D.forecast || {};
  if (has(f.series)) {
    const s=f.series, mx=Math.max(...s.map(x=>(+x.expected||0)+(+x.atRisk||0)))||1;
    const W=1000,H=290,PB=54,PL=60,PT=14, n=s.length, cw=(W-PL)/n, bw=Math.min(74,cw*0.56);
    let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cash collection forecast">`;
    for(let g=0;g<=4;g++){
      const y=PT+(H-PT-PB)*(g/4), v=mx*(1-g/4);
      svg+=`<line x1="${PL}" y1="${y}" x2="${W}" y2="${y}" stroke="#EEF2F7" stroke-width="1"/>`;
      svg+=`<text x="${PL-10}" y="${y+4}" font-size="11.5" fill="#8A99AD" text-anchor="end">${fmt(v)}</text>`;
    }
    s.forEach((x,i)=>{
      const cx=PL+cw*i+cw/2, e=+x.expected||0, r=+x.atRisk||0;
      const eh=(H-PT-PB)*(e/mx), rh=(H-PT-PB)*(r/mx), base=H-PB;
      svg+=`<rect x="${cx-bw/2}" y="${base-eh}" width="${bw}" height="${Math.max(0,eh)}" fill="#2E5A9E" rx="3"/>`;
      if(r>0) svg+=`<rect x="${cx-bw/2}" y="${base-eh-rh}" width="${bw}" height="${Math.max(0,rh)}" fill="#E2B36B" rx="3"/>`;
      svg+=`<text x="${cx}" y="${base-eh-rh-8}" font-size="12" font-weight="650" fill="#0E1726" text-anchor="middle">${fmt(e+r)}</text>`;
      svg+=`<text x="${cx}" y="${base+20}" font-size="12" fill="#5A6B82" text-anchor="middle">${esc(x.label)}</text>`;
    });
    svg+=`<line x1="${PL}" y1="${H-PB}" x2="${W}" y2="${H-PB}" stroke="#E3E8EF" stroke-width="1.5"/></svg>`;
    out += `<section>${secHead('Cash Collection Forecast')}`;
    if (has(f.commentary)) out += `<p class="sec-note">${esc(f.commentary)}</p>`;
    out += `<div class="card pad">
      ${has(f.horizon)?`<div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A99AD;font-weight:650;margin-bottom:10px">${esc(f.horizon)}</div>`:''}
      ${svg}
      <div class="legend">
        <span><i style="background:#2E5A9E"></i>Expected collection</span>
        <span><i style="background:#E2B36B"></i>At risk</span>
        ${has(f.totals&&f.totals.expected)?`<span style="margin-left:auto"><b style="color:#0E1726">Expected ${esc(f.totals.expected)}</b>${has(f.totals.atRisk)?` &nbsp;/&nbsp; at risk ${esc(f.totals.atRisk)}`:''}</span>`:''}
      </div>
      ${has(f.accuracyNote)?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid #EEF2F7;font-size:13px;color:#5A6B82">${esc(f.accuracyNote)}</div>`:''}
    </div></section>`;
  }

  /* ---------- 8. CFO Alerts ---------- */
  if (has(D.alerts)) {
    out += `<section>${secHead('CFO Alerts')}` + D.alerts.map(a=>`
      <div class="alert ${sev(a.severity)}">
        <div class="sev">${pill(a.severity)}${has(a.timing)?`<span style="font-size:12px;color:#5A6B82;font-weight:600">${esc(a.timing)}</span>`:''}</div>
        <div class="body">
          <h4>${esc(a.title)}</h4>
          <dl>
            ${has(a.finding)?`<dt>Finding</dt><dd>${esc(a.finding)}</dd>`:''}
            ${has(a.risk)?`<dt>Risk</dt><dd>${esc(a.risk)}</dd>`:''}
            ${has(a.action)?`<dt>Action</dt><dd>${esc(a.action)}</dd>`:''}
          </dl>
          ${has(a.owner)?`<div class="who">Owner: <b>${esc(a.owner)}</b>${has(a.timing)?` &nbsp;·&nbsp; Due: <b>${esc(a.timing)}</b>`:''}</div>`:''}
        </div></div>`).join('') + `</section>`;
  }

  /* ---------- 9. Key Business Risks ---------- */
  if (has(D.risks)) {
    out += `<section>${secHead('Key Business Risks')}<div class="riskgrid">` + D.risks.map(r=>`
      <div class="risk ${sev(r.severity)}">
        <div class="top"><h4>${esc(r.title)}</h4>${pill(r.severity)}</div>
        ${has(r.category)?`<span class="pill plain">${esc(r.category)}</span>`:''}
        <p style="margin-top:10px">${esc(r.description||'')}</p>
        <div class="meta">
          ${has(r.likelihood)?`<span>Likelihood <b>${esc(r.likelihood)}</b></span>`:''}
          ${has(r.impact)?`<span>Impact <b>${esc(r.impact)}</b></span>`:''}
        </div>
        ${has(r.mitigation)?`<div class="mit"><b>Mitigation</b>${esc(r.mitigation)}</div>`:''}
      </div>`).join('') + `</div></section>`;
  }

  /* ---------- 10. Recommended Actions ---------- */
  if (has(D.actions)) {
    out += `<section>${secHead('Recommended Actions')}` + D.actions.map((a,i)=>`
      <div class="action">
        <div class="n">${esc(a.rank??i+1)}</div>
        <div class="body">
          <h4>${esc(a.action)}</h4>
          ${has(a.rationale)?`<p>${esc(a.rationale)}</p>`:''}
          <div class="tags">
            ${has(a.owner)?`<span class="tag">Owner <b>${esc(a.owner)}</b></span>`:''}
            ${has(a.timing)?`<span class="tag">By <b>${esc(a.timing)}</b></span>`:''}
            ${has(a.impact)?`<span class="tag">Impact <b>${esc(a.impact)}</b></span>`:''}
            ${has(a.effort)?`<span class="tag">Effort <b>${esc(a.effort)}</b></span>`:''}
          </div>
          ${has(a.tradeoff)?`<div class="to"><b>Trade-off:</b> ${esc(a.tradeoff)}</div>`:''}
        </div></div>`).join('') + `</section>`;
  }

  /* ---------- 11. Next Steps ---------- */
  if (has(D.nextSteps)) {
    out += `<section>${secHead('Next Steps')}<div class="steps">` + D.nextSteps.map(s=>`
      <div class="step"><div class="w">${esc(s.when||'')}</div><div>${esc(s.item||'')}</div>
      <div class="o">${esc(s.owner||'')}</div></div>`).join('') + `</div></section>`;
  }

  /* ---------- Data notes ---------- */
  if (has(D.dataNotes)) {
    out += `<section><div class="notes"><h3>Data gaps and caveats</h3><ul>` +
      D.dataNotes.map(n=>`<li>${esc(n)}</li>`).join('') + `</ul></div></section>`;
  }

  out += `<footer><span>${esc(m.company||'')}${has(m.period)?` · ${esc(m.period)}`:''}</span>
    <span>CFO review of previously completed analysis. Figures as presented in source reporting.</span></footer></div>`;

  el.innerHTML = out;
  if (has(m.company)) document.title = `CFO Review - ${m.company}${has(m.period)?` - ${m.period}`:''}`;
})();
</script>
</body>
</html>
